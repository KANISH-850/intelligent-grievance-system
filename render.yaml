# Render Blueprint — Intelligent Grievance Management System
# https://render.com/docs/blueprint-spec

databases:
  - name: grievance-db
    plan: free
    databaseName: intelligent_grievance
    postgresMajorVersion: "15"

services:
  # ── 1. Python FastAPI AI Microservice ──
  - type: web
    name: grievance-ai-service
    runtime: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ── 2. Node.js Express Backend API ──
  - type: web
    name: grievance-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: node src/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: grievance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "1d"
      - key: AI_SERVICE_URL
        # After deploying, set this to the live ai-service URL
        # Example: https://grievance-ai-service.onrender.com
        sync: false
      - key: CLIENT_URL
        # After deploying the frontend, set this to its URL
        # Example: https://grievance-frontend.onrender.com
        sync: false
